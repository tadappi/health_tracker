<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>体重・生活ポイント記録</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;--accent:#2563eb;--accent-soft:#dbeafe;--grid:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}.app{max-width:720px;margin:auto;padding:10px}.stack{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px}.header,.chart-head,.week-nav,.history-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.header{align-items:end;margin-bottom:12px}.sub,.tiny{color:var(--muted);font-size:13px}.tiny{font-size:12px}h1{font-size:20px;margin:2px 0}.scorebox{min-width:112px;text-align:center;background:#f8fafc;border-radius:14px;padding:10px}.score{font-size:32px;font-weight:800}.section-title,label.title{font-weight:700;margin-bottom:8px;display:block}.date-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.date-tools>div:first-child{grid-column:1/-1}.date-tools label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}input[type=date],input[type=number]{min-height:48px;border:1px solid var(--border);border-radius:12px;padding:0 12px;background:#fff;font-size:16px}input[type=date]{width:100%}input[type=number]{width:100%;font-size:18px}.weight-row{display:flex;gap:8px;align-items:center}.meal-row{display:grid;gap:7px;margin-bottom:10px}.meal-name{font-weight:700;font-size:14px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{min-height:48px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:7px 4px;color:var(--text);font-size:13px}.choice.selected{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800}.exercise-grid{display:grid;gap:8px}.check{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:#fff}.check input{width:20px;height:20px}.actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}.btn{min-height:48px;border-radius:12px;border:1px solid var(--border);background:#fff;padding:0 14px;font-weight:700}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.small{min-height:42px;font-size:14px}.msg{min-height:22px;margin-top:8px;color:var(--muted);font-size:14px}.week-nav{margin:8px 0 10px}.week-nav button{width:48px;height:44px;border:1px solid var(--border);background:#fff;border-radius:12px;font-size:24px}.week-nav button:disabled{opacity:.35}.swipe-note{color:var(--muted);font-size:13px;text-align:center;flex:1}.chart-box{background:#f8fafc;border-radius:12px;padding:6px;margin-top:4px}svg{display:block;width:100%;height:auto;user-select:none}.chart-title{display:flex;justify-content:space-between;font-size:14px;margin-top:10px}.history{display:grid;gap:7px}.history-row{background:#f8fafc;border-radius:10px;padding:10px;font-size:14px;cursor:pointer;border:1px solid transparent}.history-row.active{border-color:var(--accent);background:var(--accent-soft)}.rules{font-size:13px;line-height:1.7;color:#374151}
</style>
</head>
<body>
<div class="app"><div class="stack">
<section class="card">
  <div class="header"><div><div class="sub" id="modeLabel">今日の記録</div><h1 id="recordDateLabel"></h1></div><div class="scorebox"><div class="sub">ポイント</div><div id="scoreDisplay" class="score">0</div></div></div>
  <div class="date-tools"><div><label for="recordDate">入力する日付</label><input id="recordDate" type="date"></div><button id="loadDateBtn" class="btn small" type="button">この日を開く</button><button id="todayBtn" class="btn small" type="button">今日に戻る</button></div>
  <label class="title" for="weight">体重</label><div class="weight-row"><input id="weight" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="例 73.2"><span>kg</span></div>
  <div style="height:16px"></div><div class="section-title">食事・酒</div><div id="mealArea"></div>
  <div style="height:10px"></div><div class="section-title">運動</div>
  <div class="exercise-grid"><label class="check"><input id="sqMorning" type="checkbox"> 朝スクワット10回 <span class="tiny">+1</span></label><label class="check"><input id="sqLunch" type="checkbox"> 昼スクワット10回 <span class="tiny">+1</span></label><label class="check"><input id="sqEvening" type="checkbox"> 晩スクワット10回 <span class="tiny">+1</span></label><label class="check"><input id="commute" type="checkbox"> 自転車または徒歩通勤 <span class="tiny">+3</span></label></div>
  <div id="message" class="msg"></div><div class="actions"><button id="saveBtn" class="btn primary" type="button">保存</button><button id="clearBtn" class="btn" type="button">入力をクリア</button></div>
</section>
<section class="card">
  <div class="chart-head"><div><div class="section-title" style="margin:0">7日間の推移</div><div id="rangeLabel" class="sub"></div></div></div>
  <div class="week-nav"><button id="prevWeek" type="button">‹</button><div class="swipe-note">グラフを左右にスワイプでも移動</div><button id="nextWeek" type="button">›</button></div>
  <div id="swipeArea"><div class="chart-title"><span>体重</span><span id="weightLatest" class="sub">記録なし</span></div><div class="chart-box"><svg id="weightChart" viewBox="0 0 640 180"></svg></div><div class="chart-title"><span>生活ポイント</span><span id="scoreLatest" class="sub">記録なし</span></div><div class="chart-box"><svg id="scoreChart" viewBox="0 0 640 180"></svg></div></div>
</section>
<section class="card"><div class="chart-head"><div><div class="section-title" style="margin:0">保存済み</div><div class="sub">日付をタップすると編集できます</div></div><button id="deleteSelectedBtn" class="btn small" type="button">この日を削除</button></div><div id="history" class="history" style="margin-top:10px"></div></section>
<section class="card"><div class="section-title">採点ルール（仮）</div><div class="rules">朝食：控えめ +1 / 普通 0 / 食べ過ぎ -2<br>昼食：控えめ +1 / 普通 0 / 食べ過ぎ -2<br>夕食：控えめ +2 / 普通 0 / 食べ過ぎ -3<br>間食：控えめ・なし +2 / 普通 0 / 食べ過ぎ -2<br>酒：断酒 +3 / 少し 0 / 飲み過ぎ -4<br>運動：スクワット各 +1 / 自転車・徒歩通勤 +3</div><div class="tiny" style="margin-top:8px">体重はポイントに含めず、結果として別グラフで表示。</div></section>
</div></div>
<script>
(()=>{
const STORAGE_KEY='tada_health_records_v1';
const mealDefs=[{id:'breakfast',label:'朝食',opts:[['控えめ',1],['普通',0],['食べ過ぎ',-2]]},{id:'lunch',label:'昼食',opts:[['控えめ',1],['普通',0],['食べ過ぎ',-2]]},{id:'dinner',label:'夕食',opts:[['控えめ',2],['普通',0],['食べ過ぎ',-3]]},{id:'snack',label:'間食',opts:[['控えめ・なし',2],['普通',0],['食べ過ぎ',-2]]},{id:'alcohol',label:'酒',opts:[['断酒',3],['少し',0],['飲み過ぎ',-4]]}];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const today=new Date();today.setHours(12,0,0,0);const todayKey=dateKey(today);let currentDateKey=todayKey,weekOffset=0,records=(()=>{try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}})();
const persist=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
function makeMeals(){mealDefs.forEach(def=>{const row=document.createElement('div');row.className='meal-row';const n=document.createElement('div');n.className='meal-name';n.textContent=def.label;const c=document.createElement('div');c.className='choices';def.opts.forEach(([text,score],i)=>{const b=document.createElement('button');b.type='button';b.className='choice'+(i===1?' selected':'');b.dataset.group=def.id;b.dataset.score=score;b.dataset.text=text;b.textContent=text;b.addEventListener('click',()=>{document.querySelectorAll(`.choice[data-group="${def.id}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');updateScore()});c.appendChild(b)});row.append(n,c);$('mealArea').appendChild(row)})}
const selected=id=>document.querySelector(`.choice[data-group="${id}"].selected`);
function score(){let t=0;mealDefs.forEach(d=>{const s=selected(d.id);if(s)t+=Number(s.dataset.score)});if($('sqMorning').checked)t++;if($('sqLunch').checked)t++;if($('sqEvening').checked)t++;if($('commute').checked)t+=3;return t}
function updateScore(){const s=score();$('scoreDisplay').textContent=s>0?`+${s}`:String(s)}
['sqMorning','sqLunch','sqEvening','commute'].forEach(id=>$(id).addEventListener('change',updateScore));
function clearFields(){ $('weight').value='';mealDefs.forEach(d=>{[...document.querySelectorAll(`.choice[data-group="${d.id}"]`)].forEach((b,i)=>b.classList.toggle('selected',i===1))});['sqMorning','sqLunch','sqEvening','commute'].forEach(id=>$(id).checked=false);updateScore() }
function updateMode(){const d=parseKey(currentDateKey);$('recordDate').value=currentDateKey;$('recordDateLabel').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;$('modeLabel').textContent=currentDateKey===todayKey?'今日の記録':'過去日の記録';$('saveBtn').textContent=`${d.getMonth()+1}/${d.getDate()}を保存`}
function loadDate(k){currentDateKey=k;clearFields();const r=records.find(x=>x.date===k);if(r){$('weight').value=Number.isFinite(r.weight)?r.weight:'';mealDefs.forEach(d=>{const wanted=r.meals?.[d.id];if(wanted)document.querySelectorAll(`.choice[data-group="${d.id}"]`).forEach(b=>b.classList.toggle('selected',b.dataset.text===wanted))});$('sqMorning').checked=!!r.exercise?.morning;$('sqLunch').checked=!!r.exercise?.lunch;$('sqEvening').checked=!!r.exercise?.evening;$('commute').checked=!!r.exercise?.commute;$('message').textContent='保存済みの内容を読み込みました。修正して保存できます。'}else $('message').textContent='この日はまだ記録がありません。新規入力できます。';updateMode();updateScore();renderHistory()}
function getRecord(){const raw=$('weight').value.trim(),w=raw===''?null:Number(raw);if(w!==null&&(!Number.isFinite(w)||w<30||w>250))throw Error('体重は30〜250kgの範囲で入力してね。');const meals={};mealDefs.forEach(d=>meals[d.id]=selected(d.id)?.dataset.text||'');return{date:currentDateKey,weight:w,score:score(),meals,exercise:{morning:$('sqMorning').checked,lunch:$('sqLunch').checked,evening:$('sqEvening').checked,commute:$('commute').checked}}}
$('saveBtn').addEventListener('click',()=>{try{const r=getRecord(),i=records.findIndex(x=>x.date===currentDateKey);if(i>=0)records[i]=r;else records.push(r);persist();$('message').textContent='保存しました。';weekOffset=0;renderAll()}catch(e){$('message').textContent=e.message}});
$('clearBtn').addEventListener('click',()=>{clearFields();$('message').textContent='入力欄だけクリアしました。保存済みデータは消えていません。'});
$('loadDateBtn').addEventListener('click',()=>{if($('recordDate').value)loadDate($('recordDate').value)});$('todayBtn').addEventListener('click',()=>loadDate(todayKey));$('recordDate').addEventListener('change',()=>{$('message').textContent='「この日を開く」を押すと、その日の記録を読み込みます。'});
$('deleteSelectedBtn').addEventListener('click',()=>{if(!records.some(r=>r.date===currentDateKey)){$('message').textContent='この日の保存記録はありません。';return}records=records.filter(r=>r.date!==currentDateKey);persist();clearFields();$('message').textContent='この日の保存記録を削除しました。';renderAll()});
function windowDates(){const end=new Date(today);end.setDate(end.getDate()+weekOffset*7);const start=new Date(end);start.setDate(start.getDate()-6);return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d})}const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;
function draw(svg,dates,field,opt={}){const W=640,H=180,L=44,R=18,T=16,B=34,ns='http://www.w3.org/2000/svg';svg.innerHTML='';const pts=dates.map(d=>{const r=records.find(x=>x.date===dateKey(d));return{d,v:r&&Number.isFinite(r[field])?Number(r[field]):null}}),vals=pts.map(p=>p.v).filter(Number.isFinite);let min,max;if(vals.length){min=Math.min(...vals);max=Math.max(...vals);if(min===max){min--;max++}else{const m=(max-min)*.18;min-=m;max+=m}if(opt.zero){min=Math.min(min,0);max=Math.max(max,0)}}else{min=opt.zero?-5:0;max=opt.zero?10:1}const x=i=>L+i*(W-L-R)/6,y=v=>T+(max-v)*(H-T-B)/(max-min);for(let i=0;i<4;i++){const gy=T+i*(H-T-B)/3,l=document.createElementNS(ns,'line');l.setAttribute('x1',L);l.setAttribute('x2',W-R);l.setAttribute('y1',gy);l.setAttribute('y2',gy);l.setAttribute('stroke','var(--grid)');svg.appendChild(l);if(vals.length){const tx=document.createElementNS(ns,'text');tx.setAttribute('x',L-6);tx.setAttribute('y',gy+4);tx.setAttribute('text-anchor','end');tx.setAttribute('font-size','11');tx.setAttribute('fill','var(--muted)');tx.textContent=opt.dec?(max-i*(max-min)/3).toFixed(1):Math.round(max-i*(max-min)/3);svg.appendChild(tx)}}let path='',open=false;pts.forEach((p,i)=>{if(Number.isFinite(p.v)){path+=`${open?' L':' M'} ${x(i)} ${y(p.v)}`;open=true}else open=false});if(path){const p=document.createElementNS(ns,'path');p.setAttribute('d',path);p.setAttribute('fill','none');p.setAttribute('stroke','var(--accent)');p.setAttribute('stroke-width','3');p.setAttribute('stroke-linecap','round');svg.appendChild(p)}pts.forEach((p,i)=>{const tx=document.createElementNS(ns,'text');tx.setAttribute('x',x(i));tx.setAttribute('y',H-10);tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size','11');tx.setAttribute('fill','var(--muted)');tx.textContent=fmt(p.d);svg.appendChild(tx);if(Number.isFinite(p.v)){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',x(i));c.setAttribute('cy',y(p.v));c.setAttribute('r','4');c.setAttribute('fill','var(--accent)');svg.appendChild(c)}});if(!vals.length){const tx=document.createElementNS(ns,'text');tx.setAttribute('x','320');tx.setAttribute('y','88');tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size','14');tx.setAttribute('fill','var(--muted)');tx.textContent='この7日間の記録はありません';svg.appendChild(tx)}}
function renderHistory(){const h=$('history');h.innerHTML='';const arr=[...records].sort((a,b)=>a.date.localeCompare(b.date)).slice(-14).reverse();if(!arr.length){h.innerHTML='<div class="sub">まだ記録がありません。</div>';return}arr.forEach(r=>{const row=document.createElement('div');row.className='history-row'+(r.date===currentDateKey?' active':'');row.innerHTML=`<span>${r.date.slice(5).replace('-','/')}</span><span>${Number.isFinite(r.weight)?r.weight.toFixed(1)+' kg':'体重なし'}</span><strong>${r.score>0?'+':''}${r.score}点</strong>`;row.addEventListener('click',()=>loadDate(r.date));h.appendChild(row)})}
function renderAll(){const dates=windowDates();$('rangeLabel').textContent=`${fmt(dates[0])} 〜 ${fmt(dates[6])}`;draw($('weightChart'),dates,'weight',{dec:true});draw($('scoreChart'),dates,'score',{zero:true});const wr=dates.map(d=>records.find(r=>r.date===dateKey(d))).filter(Boolean),ws=wr.filter(r=>Number.isFinite(r.weight));$('weightLatest').textContent=ws.length?`最新 ${ws.at(-1).weight.toFixed(1)} kg`:'記録なし';$('scoreLatest').textContent=wr.length?`最新 ${wr.at(-1).score>0?'+':''}${wr.at(-1).score} 点`:'記録なし';$('nextWeek').disabled=weekOffset>=0;renderHistory()}
$('prevWeek').addEventListener('click',()=>{weekOffset--;renderAll()});$('nextWeek').addEventListener('click',()=>{if(weekOffset<0){weekOffset++;renderAll()}});let sx=null;$('swipeArea').addEventListener('pointerdown',e=>sx=e.clientX);$('swipeArea').addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)<50)return;if(dx>0)weekOffset--;else if(weekOffset<0)weekOffset++;renderAll()});$('swipeArea').addEventListener('pointercancel',()=>sx=null);
makeMeals();loadDate(todayKey);renderAll();
})();
</script>
</body>
</html>
